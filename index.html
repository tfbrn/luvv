<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>💌 Untuk Kamu</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
<link rel="stylesheet" href="https://htmlku.com/semogakamu/style.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://unpkg.com/typeit@8.7.0/dist/index.umd.js"></script>

<style>
body{margin:0}
.mainSt img{
width:80px;height:80px;
background:rgba(255,255,255,0.2);
border-radius:50%;
padding:10px;
}
.overlay{
position:fixed;
top:0;left:0;right:0;bottom:0;
display:flex;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.6);
z-index:999;
}
.cover{
text-align:center;
color:white;
}
</style>
</head>

<body>

<!-- AUDIO OPTIONAL (boleh dihapus kalau tidak ada file) -->
<!-- <audio src="jangancape.mp3" id="linkmp3"></audio> -->

<div class="overlay">
  <div class="cover">
    <p style="font-weight:bold">Bukaa ini yaaa Sayaangg 💕</p>
    <div id="loveIn" style="cursor:pointer;font-size:18px">❤️ Sentuh LOVEnya ❤️</div>
  </div>
</div>

<div class="swiper">
<div class="mainMsg">
<div class="mainSt">
<img id="st1" src="https://htmlku.com/0/panda/ngumpet.gif"/>
</div>
<span class="mainTxt"></span>
</div>
</div>

<script>
const texts = [
"Jangan Cape Sama Aku yaa 🥺",
"Aku memang kadang egois...",
"Tapi aku tulus sayang kamu 💕",
"Jangan tinggalin aku yaaa 🫶"
];

let index=0;

document.getElementById("loveIn").onclick=function(){
document.querySelector(".overlay").style.display="none";
tampilkan();
};

function tampilkan(){
if(index<texts.length){
new TypeIt(".mainTxt",{
strings:texts[index],
speed:40,
afterComplete:function(){
setTimeout(()=>{
document.querySelector(".mainTxt").innerHTML="";
index++;
tampilkan();
},1500);
}
}).go();
}
}
</script>

</body>
</html>
