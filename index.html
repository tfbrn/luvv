<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ucapan Maaf</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
      color: white;
      text-align: center;
    }

    #bgbelakang img {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .box {
      margin-top: 100px;
      font-size: 24px;
      animation: fadeIn 3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .gif {
      width: 200px;
      margin: 20px auto;
      display: block;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .sembunyi {
      display: none;
    }
  </style>
</head>
<body onload="mulai()">

  <!-- Background -->
  <div id="bgbelakang">
    <img src="https://i.ibb.co/nDMNsVT/sunset.jpg" alt="Background">
  </div>

  <!-- Audio -->
  <audio src="https://tfbrn.github.io/songs/ultah.mp3" id="linkmp3" class="sembunyi"></audio>

  <!-- Konten -->
  <div class="box" id="teks">
    <h2 id="pesan">Hai, aku mau bilang...</h2>
    <img src="https://i.ibb.co/9hHqXWf/sorry1.gif" class="gif" id="gif1" alt="Gif">
  </div>

  <script>
    let audio;

    async function mulai(){
      audio = document.getElementById("linkmp3");
      audio.play();

      // Teks berganti setelah beberapa detik
      setTimeout(() => {
        document.getElementById("pesan").innerText = "Maaf ya... aku bikin kamu badmood 😔";
        document.getElementById("gif1").src = "https://i.ibb.co/Ryy0cFx/sorry2.gif";
      }, 5000);

      setTimeout(() => {
        document.getElementById("pesan").innerText = "Sungguh, aku nggak bermaksud bikin kamu sedih 💔";
        document.getElementById("gif1").src = "https://i.ibb.co/sQP8L4w/sorry3.gif";
      }, 10000);

      setTimeout(() => {
        document.getElementById("pesan").innerText = "Semoga kamu mau maafin aku 🤲";
        document.getElementById("gif1").src = "https://i.ibb.co/ZmMQM0W/sorry4.gif";
      }, 15000);
    }
  </script>

</body>
</html>
